<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist HTTP Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>HTTP<span>Client</span></h1>
        </header>

        <main class="card">
            <div class="input-group">
                <select id="method">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <input type="text" id="url" placeholder="https://api.example.com/v1/resource" required>
                <button id="send-btn">Send Request</button>
            </div>

            <div class="section-container">
                <div class="section-header">
                    <h3>Request Headers</h3>
                    <button type="button" id="add-header-btn" class="secondary-btn">+ Add Header</button>
                </div>
                <div id="headers-list">
                    <div class="header-row">
                        <input type="text" class="header-key" placeholder="Key (e.g., Content-Type)">
                        <input type="text" class="header-value" placeholder="Value">
                        <button type="button" class="remove-header-btn" onclick="this.parentElement.remove()">&times;</button>
                    </div>
                </div>
            </div>

            <div class="section-container">
                <h3>Request Body (JSON)</h3>
                <textarea id="body" placeholder='{ "name": "John Doe" }'></textarea>
            </div>
        </main>

        <section class="response-container">
            <div class="meta-info">
                <span id="status-badge" class="badge">Status: --</span>
            </div>

            <div class="output-grid">
                <div class="panel">
                    <h3>Response Headers</h3>
                    <pre id="res-headers">Waiting...</pre>
                </div>
                <div class="panel">
                    <h3>Response Body</h3>
                    <pre id="res-body">No data to display.</pre>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
